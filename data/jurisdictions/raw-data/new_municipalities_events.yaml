# UPDATE: I don't think it makes sense to have absorptions, because the receiving
# municipality would end up with duplicate connections; one already in place for
# the absorbing municipality, and one for the municipality being absorbed.
# At the end of the day, an absorption is just a special case of a merger wher
# the new municipality appears at the same location of one the two old ones.
# To avoid confusions, we force the closure of all connections involved in the merger
# in the year of the merger and the decision by the participants of the diameter
# of the pipe for the new connection. Basically they need to decide how to connect
# the new municipality.
# Since this requires them to know which municipality ets created before the stage 
# begins, we skip this for the first stage and keep it only for the second and third.